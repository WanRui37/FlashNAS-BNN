name: Framework checks
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.0.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 -r requirements-dev.txt
      - run: python -m pytest -q
